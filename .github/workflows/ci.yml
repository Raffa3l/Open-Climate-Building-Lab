name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rechenkern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Abhängigkeiten
        run: cd core && npm ci
      - name: Typprüfung
        run: cd core && npx tsc --noEmit
      - name: Tests
        run: node --test "core/test/*.test.ts"
      - name: Verweise Code -> Dokumentation
        run: ./scripts/check-references.sh

  data:
    name: ETL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Selbsttest der Variablenskalierung
        run: python -c "import sys; sys.path.insert(0,'data'); import ocbl_data.variables"
      - name: CLI erreichbar
        run: cd data && python -m ocbl_data --help

  integration:
    name: Kette Ende zu Ende
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lädt echte Daten von data.geo.admin.ch. Schlägt fehl, wenn sich
      # Format, Kodierung oder Spaltennamen der Quelle ändern — genau das
      # soll dieser Job merken.
      - name: Stationsjahre bauen
        # Zwei Stationen, damit auch der Katalog mit mehreren Einträgen läuft;
        # für SMA fünf Jahre, sonst gibt es keinen Trend über die Jahre.
        run: |
          cd data
          python -m ocbl_data build --station SMA --from 2020 --to 2024 --qa
          python -m ocbl_data build --station LUG --from 2023 --to 2023 --qa
      - name: Vom Rechenkern lesen und rechnen
        run: node --test core/test/pack.test.ts
      - name: Report
        run: node core/scripts/report.ts SMA
      - name: Stationsvergleich
        run: node core/scripts/stations.ts 2023
      # Laedt das 33-MB-Archiv der Klimaszenarien und prueft dabei die
      # rueckwaerts erschlossenen Konventionen: Steigt der Fehler der
      # Strahlungsbilanz, hat sich am Quellformat etwas geaendert.
      - name: Klimaszenarien bauen
        run: cd data && python -m ocbl_data scenarios --station SMA --station LUG --qa
      - name: Prüfsummen beider Kataloge
        run: cd data && python -m ocbl_data verify
      - name: Gegenwart gegen Zukunft
        run: node core/scripts/climate-change.ts SMA
      - name: Raummodell auf echten Daten
        run: node core/scripts/overheating.ts SMA 2023
      # Verlauf über die Jahre samt Szenarien; prüft auch, dass Trend und
      # Periodenmittel mit wenigen Jahren nicht abstürzen, sondern melden.
      - name: Mehrjahresverlauf
        run: node core/scripts/trend.ts 'station=SMA'
      - name: Trend an allen Stationen
        run: node core/scripts/trends.ts '' 5
      # Prüft den Emit-Pfad aus ADR 0006: bricht tsc die Browser-Ausgabe,
      # fällt es hier auf und nicht erst beim Aufruf der Seite.
      - name: Web bauen
        run: cd core && npm ci && cd .. && ./scripts/build-web.sh
